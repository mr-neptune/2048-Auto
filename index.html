<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048-Auto</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="game-area">
            <aside class="control-panel" aria-label="Computer play controls">
                <h2>Computer Play</h2>
                <div class="control-section">
                    <p class="control-label">Method</p>
                    <label class="control-option">
                        <input type="radio" name="play-method" value="random">
                        <span>Random moves</span>
                    </label>
                    <label class="control-option">
                        <input type="radio" name="play-method" value="cnn">
                        <span>Old CNN: move scorer <small>(retired)</small>
                            <small class="option-note">Learned to score each of the 4 moves directly. The random new tile made that too noisy to learn: it never reached 1024.</small>
                        </span>
                    </label>
                    <label class="control-option">
                        <input type="radio" name="play-method" value="afterstate">
                        <span>New CNN: board scorer
                            <small class="option-note">Slides the tiles itself, then scores the board before the new tile appears. Trained on the real game score.</small>
                        </span>
                    </label>
                    <label class="control-option">
                        <input type="radio" name="play-method" value="afterstate_search" checked>
                        <span>New CNN + look-ahead
                            <small class="option-note">Same network, but also checks every place the next tile could land before moving. Strongest.</small>
                        </span>
                    </label>
                </div>
                <div class="control-section">
                    <p class="control-label">Speed</p>
                    <label class="control-option">
                        <input type="radio" name="play-speed" value="slow">
                        <span>Slow</span>
                    </label>
                    <label class="control-option">
                        <input type="radio" name="play-speed" value="normal" checked>
                        <span>Normal</span>
                    </label>
                    <label class="control-option">
                        <input type="radio" name="play-speed" value="fast">
                        <span>Fast</span>
                    </label>
                </div>
                <button id="auto-play-toggle" class="button-auto-play" type="button">Start Auto Play</button>
                <p id="control-status" class="control-status" role="status" aria-live="polite"></p>
            </aside>
            <div class="board-area">
                <div class="header">
                    <button class="button-new-game" onclick="newGame()">New Game</button>
                    <div class="score-tab">Score: <span id="current-score">0</span></div>
                </div>
                <div id="game-container">
                    <div class="grid">
                        <div class="tile-container"></div>
                        <!-- Generate grid cells -->
                        <div class="grid-row">
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                        </div>
                        <div class="grid-row">
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                        </div>
                        <div class="grid-row">
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                        </div>
                        <div class="grid-row">
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                            <div class="grid-cell"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
